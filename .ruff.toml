# Ruff linter config, see https://docs.astral.sh/ruff/

target-version = "py312"    # same as CI / .venv
line-length = 120           # long signal/parameter names

extend-exclude = [
    "tb/results",           # generated sim outputs
]

[lint]
# start with ruff defaults, extend group by group
select = [
    "E", "W",               # pycodestyle: errors, warnings
    "F",                    # pyflakes: unused imports/vars, undefined names
    "I",                    # isort: import order
    "UP",                   # pyupgrade: modern Python syntax
    "B",                    # bugbear: likely bugs
    "C4",                   # comprehensions: simpler list/dict/set code
    "SIM",                  # simplify: shorter if/loop/bool code
    "PT",                   # pytest-style: pytest conventions
    "RUF",                  # ruff-specific rules
]
ignore = [
    "E501",                 # line too long, enable after formatter decision
    "SIM108",               # ternary one-liners, if/else block is more readable
]

[lint.per-file-ignores]
"rtl/**/*_wrap.py" = ["E501"]   # long lines in Verilog templates

[lint.isort]
# import blocks: stdlib / pytest / cocotb / cocotbext / other
section-order = [
    "future", "standard-library",
    "pytest", "cocotb", "cocotbext",
    "third-party", "first-party", "local-folder",
]

[lint.isort.sections]
pytest = ["pytest"]
cocotb = ["cocotb", "cocotb_tools", "cocotb_bus"]
cocotbext = ["cocotbext"]
