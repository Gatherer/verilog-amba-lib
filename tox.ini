# tox configuration
[tox]
envlist = py3
skipsdist = True
minversion = 3.2.0
requires = virtualenv >= 16.1

[gh-actions]
python =
    3.10: py3

[testenv]
deps =
    pytest == 9.1.1
    pytest-xdist == 3.8.0
    pytest-split == 0.11.0
    cocotb == 2.1.0
    cocotb-bus == 0.3.0
    cocotbext-axi == 0.1.28
    jinja2 == 3.1.6

commands =
    pytest {posargs:-n auto --verbose}

# pytest configuration
[pytest]
testpaths =
    tb
addopts =
    --import-mode importlib
